<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered CELPIP English exam practice coach. Practise Listening, Reading, Writing, and Speaking with real-time AI feedback." />
  <title>CELPIP Exam Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/styles/index.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app/scripts/main.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const existingKey = sessionStorage.getItem('gemini_session_key');
      if (!existingKey) {
        setTimeout(() => {
          const key = prompt("Enter your Google Gemini API Key for this practice session:\n(Never saved in code or sent anywhere else)");
          if (key && key.trim()) {
            sessionStorage.setItem('gemini_session_key', key.trim());
          }
        }, 500);
      }
    });
  </script>
</body>
</html>
